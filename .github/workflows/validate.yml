name: Validate AgentShelf
on:
  pull_request:
  push:
    branches: [validation/automation-release]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm run build
      - run: node --test tests/minimal.test.mjs tests/prompt-agents.test.mjs tests/growth.test.mjs
