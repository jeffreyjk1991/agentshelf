name: AIBin release browser QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install dependencies
        run: npm ci
      - name: Test production configuration
        run: npm test
        env:
          VERCEL_ENV: production
          VERCEL: '1'
      - name: Install isolated browser test runner
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise actual pages in Chromium
        run: node scripts/browser-feature-qa.mjs
