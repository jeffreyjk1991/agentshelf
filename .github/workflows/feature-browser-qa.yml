name: AIBin release browser QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install dependencies
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Test production configuration
        run: npm test
        env:
          VERCEL_ENV: production
          VERCEL: '1'
      - name: Install isolated browser test runner
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Exercise actual pages in Chromium
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            CHROME_BIN="$(command -v google-chrome)" node scripts/browser-feature-qa.mjs
          else
            npx playwright install chromium
            node scripts/browser-feature-qa.mjs
          fi
