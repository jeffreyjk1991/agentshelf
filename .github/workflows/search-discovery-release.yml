name: AIBin search discovery release
on:
  push:
    branches: [main]
    paths:
      - 'scripts/submit-discovery-indexnow.mjs'
permissions:
  contents: read
jobs:
  verify-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify deployed discovery files then notify IndexNow once
        run: node scripts/submit-discovery-indexnow.mjs
