name: AIBin submission release QA
on:
  push:
    branches: [main]
    paths:
      - 'scripts/check-submission-release.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  submission:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: node scripts/check-submission-release.mjs
